# SIMSEK DUELLO SUNUCUSU -- server.properties USTUNE YAZILAN AYARLAR
#
# Bu dosya BDS'in kendi server.properties'inin YERINE GECMIYOR.
# sunucu_kur.sh Mojang'in o surumle gelen dosyasini alir ve yalniz
# buradaki anahtarlari degistirir (yoksa sona ekler). Boylece yeni
# BDS surumu yeni bir anahtar getirirse kaybolmaz, Mojang'in metni
# de depoya girmez.
#
# Degerler BDS 1.26.52.3'un gercek dosyasindan ve Mojang'in
# bedrock_server_how_to.html belgesinden okundu (2026-10-27).
# Gerekce ve sinirlar: addon/SUNUCU_REHBERI.md
#
# test/sunucu.mjs bu dosyayi kilitliyor: bir kilit gevserse test dusuyor.

# ---- KIM GIREBILIR ----
# Yalniz allowlist.json'daki oyuncular. Liste BOSKEN KIMSE giremez;
# oyuncu sunucu konsolundan eklenir: allowlist add <Gamertag>
allow-list=true
# Xbox Live dogrulamasi. Kapatilirsa herkes istedigi adla girer.
online-mode=true
# Ilk kez giren oyuncu uye (operator degil). Op yalniz konsoldan: op <ad>
default-player-permission-level=member
# Komut yok: /gamemode, /give, /tp oyuncuya kapali. Op ailesi buradan
# kapaniyor. Konsol yine her komutu calistirir.
allow-cheats=false
max-players=4
# Yerel agda sunucu listesinde gorunmesin; yalniz IP ile baglanilir.
enable-lan-visibility=false

# ---- DUELLO YERI: MACERA KIPI ----
# Oyuncu blok KIRAMAZ ve KOYAMAZ. Blok ailesinin butun hileleri (hizli
# kirma, nuke, hizli insa, kopru kurucu, bloklarla hapsetme, uzaktan
# koyma/kirma) oyun kuraliyla kapaniyor; sunucu o paketleri reddeder.
# Kendi yeteneklerimiz BETIKLE blok degistiriyor, kipten etkilenmiyor.
# BEDELI: dovuste insa da yok (kule, kopru). Istenirse tek satir:
# gamemode=survival
gamemode=adventure
# Dunya olustuktan sonra da her giriste bu kip gonderilsin.
force-gamemode=true
difficulty=normal

# ---- BAGLANTI ----
# nethernet (Mojang'in varsayilani): server-port'ta TCP el sikisma, sonra
# her oyuncuyla UDP. Acikca yaziliyor ki varsayilan degisirse sessizce
# degismesin.
# raknet DENENDI VE BIRAKILDI (2026-10-27): IPv6'si olmayan makinede
# 19133'u acamayinca sunucu hic acilmiyor ("Port may be in use ...
# Exiting program"). nethernet IPv6 yoksa IPv4'e dusuyor.
transport=nethernet
# Oyuncu UDP baglantilari isletim sisteminin rastgele portlari yerine bu
# araliktan. Guvenlik duvari ve modem icin acilacak portlar belli olsun:
#   TCP 19132  +  UDP 19140-19199
server-udp-ports=19140-19199
# Arena 3x3 chunk. Uzak alanin gonderilmemesi sunucuyu rahatlatir;
# ESP/minimap'i KAPATMAZ, yalniz uzagi gostermez.
view-distance=10

# ---- HAREKET VE VURUS: SUNUCU KARAR VERIR ----
# Mojang: istemcinin konum bilgisini daha az hosgoruyle kabul eder,
# daha cok duzeltme gonderir. BEDELI: yuksek gecikmeli durust oyuncu
# da geri cekilir (rubber-band).
server-authoritative-movement-strict=true
server-authoritative-dismount-strict=true
# Oyuncular arasi etkilesimde (vurus) daha siki.
server-authoritative-entity-interactions-strict=true
# Konum hosgorusu. Mojang: 1.0'in ustu hileye kapi acar. Varsayilan.
player-position-acceptance-threshold=0.5
# Vurus yonu ile bakis yonu arasindaki fark siniri (1 = birebir).
# Varsayilan; daraltmak hizli donen durust oyuncuyu da keser.
player-movement-action-direction-threshold=0.85

# ---- PAKET HIZ SINIRI ----
# Belgede var, gelen server.properties'te YOK (varsayilan kapali).
# Kurallar packetlimitconfig.json'da: sohbet seli (spammer) burada
# sunucu duzeyinde kesiliyor.
enable-packet-rate-limiter=true

# ---- PAKETLER ----
# Bizim gorunum paketimiz (kollar, modeller) istemciye zorunlu gider.
# DIKKAT: bu PAYLASMAK demek. addon/yerel/ (kisisel izinli varliklar)
# sunucuya ASLA kurulmaz; sunucu_kur.sh onu hic okumuyor.
texturepack-required=true

# ---- KAYIT ----
# Betik ve icerik hatalari hem dosyaya hem konsola.
content-log-file-enabled=true
content-log-console-output-enabled=true

# ---- DUNYA ----
server-name=Simsek Duello
level-name=Simsek Duello
