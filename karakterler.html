<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karakterler — Kanlı Göz</title>
  <meta name="description" content="Kanlı Göz evrenindeki tüm karakterler: güçleri, tarafları ve hikayedeki yerleri.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/animasyon.css">
</head>
<body>

<header class="ust-bar" data-menu></header>
<div class="durum-serit" data-durum></div>

<section>
  <div class="kapsayici">
    <span class="ust-etiket">Arşiv</span>
    <h1 class="bozuk" data-metin="Karakterler">Karakterler</h1>
    <p class="giris-metni">
      Altın renkli <span class="rozet oynanan">Oynanan</span> rozeti, hikayede
      bizzat canlandırılan iki karakteri işaret ediyor: biri en iyilerden,
      diğeri en kötülerden.
    </p>
  </div>
</section>

<section>
  <div class="kapsayici">
    <h2>İyiler</h2>
    <div class="izgara" style="margin-top:24px" data-karakterler="iyi"></div>
  </div>
</section>

<section>
  <div class="kapsayici">
    <h2>Kötüler</h2>
    <div class="izgara" style="margin-top:24px" data-karakterler="kotu"></div>
  </div>
</section>

<section>
  <div class="kapsayici">
    <h2>Tarafı Belirsiz</h2>
    <p class="giris-metni">
      Bir tarafa ihanet etmiş olmak, otomatik olarak diğer tarafta olmak anlamına gelmiyor.
    </p>
    <div class="izgara" style="margin-top:24px" data-karakterler="belirsiz"></div>
  </div>
</section>

<div class="sizinti" data-sizinti></div>

<footer class="alt-bilgi" data-alt-bilgi></footer>

<script src="assets/js/data.js"></script>

</html>
