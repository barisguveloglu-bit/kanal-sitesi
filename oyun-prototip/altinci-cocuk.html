<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Five Nights at Freddy's: The Sixth Child — Prototype</title>
<style>
/* ============================================================
   ALTINCI ÇOCUK — oynanabilir prototip
   Tek dosya. Derleme yok, paket yok, dış kaynak yok.
   Yazı tipleri önce gerçek adlarıyla aranıyor; yoksa sistem
   karşılıkları devreye giriyor (bkz. FNAF-ALTINCI-COCUK.md §8).
   ============================================================ */
:root{
  --bg:#08090b; --panel:#101216; --line:#22262e;
  --text:#cfd4dc; --dim:#767d8a;

  --c-jesse:#f2efe8;
  --c-michael:#9fb3c8;
  --c-gil:#b9a88c;
  --c-freddy:#c98a3b;
  --c-bonnie:#8e6fd8;
  --c-chica:#e8c33a;
  --c-foxy:#c4453b;
  --c-golden:#d9c46a;
  --c-puppet:#edeae3;
  --c-bad:#d2564a;

  --f-jesse:"Nunito",ui-rounded,"SF Pro Rounded","Trebuchet MS",system-ui,sans-serif;
  --f-michael:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-machine:"VT323","Courier New",ui-monospace,monospace;
  --f-child:"Patrick Hand","Comic Sans MS","Segoe Print","Bradley Hand",cursive;
  --f-type:"Special Elite","Courier New",monospace;
  --f-news:"Libre Baskerville",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;height:100%;background:#000;color:var(--text);
  font-family:var(--f-michael);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid #7aa2c8;outline-offset:2px}

#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:#000}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:20px}

/* ---------- menü ---------- */
#menu h1{font-family:var(--f-machine);font-size:clamp(26px,6vw,60px);
  letter-spacing:.16em;text-transform:uppercase;margin:0;color:#e6e2d8;
  text-shadow:0 0 22px rgba(200,180,120,.16);animation:titleFlick 7s steps(1) infinite}
@keyframes titleFlick{0%,63%,100%{opacity:1}64%{opacity:.25}65%{opacity:1}
  78%{opacity:.5}79%{opacity:1}80%{opacity:.15}81.5%{opacity:1}}
#menu .art{margin-bottom:6px;opacity:.9;filter:drop-shadow(0 8px 26px rgba(0,0,0,.9))}
#menu .sub{font-family:var(--f-child);font-size:clamp(20px,4.6vw,40px);
  color:var(--c-puppet);margin:6px 0 2px}
#menu .tag{color:var(--dim);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.mbtns{display:flex;flex-direction:column;gap:10px;margin-top:34px;width:min(300px,84vw)}
.mbtn{background:#0e1116;border:1px solid var(--line);color:var(--text);
  padding:12px 16px;letter-spacing:.09em;text-transform:uppercase;font-size:13px}
.mbtn:hover{background:#161a21;border-color:#3a414d}
.mbtn.primary{border-color:#4a5260;color:#fff}
#star{margin-top:22px;color:var(--c-golden);font-size:22px;letter-spacing:.4em;height:26px}

/* ---------- sahne seçici ---------- */
#picker .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:8px;width:min(760px,94vw);max-height:64vh;overflow:auto;padding:2px}
#picker .p{background:#0e1116;border:1px solid var(--line);padding:10px 12px;text-align:left}
#picker .p:hover{background:#171b22}
#picker .p b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#fff}
#picker .p span{display:block;font-size:11px;color:var(--dim);margin-top:3px}
#picker h2{font-family:var(--f-machine);letter-spacing:.2em;text-transform:uppercase;
  font-size:20px;color:#e6e2d8;margin:0 0 4px}

/* ---------- oda / sahne görünümü ---------- */
.room{position:relative;width:min(1000px,96vw);aspect-ratio:16/10;
  background:#040507;border:1px solid var(--line);overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.bg svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* fener: yumuşak koni + sıcak göbek */
.beam{position:absolute;width:640px;height:640px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,246,216,.26) 0%,rgba(255,242,206,.13) 26%,
    rgba(255,238,196,.05) 48%,rgba(255,238,196,0) 70%);
  transform:translate(-50%,-50%);mix-blend-mode:screen;z-index:3}
.beam::after{content:"";position:absolute;left:50%;top:50%;width:150px;height:150px;
  transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(255,250,230,.22),rgba(255,250,230,0) 70%);
  animation:beamPulse 3.4s ease-in-out infinite}
@keyframes beamPulse{0%,100%{opacity:.75;transform:translate(-50%,-50%) scale(1)}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.09)}}

/* toz zerreleri */
.motes{position:absolute;inset:0;pointer-events:none;z-index:2;opacity:.5}
.mote{position:absolute;width:2px;height:2px;border-radius:50%;background:#cfc7ae;
  opacity:.0;animation:mote linear infinite}
@keyframes mote{0%{opacity:0;transform:translateY(0)}
  12%{opacity:.55}88%{opacity:.4}100%{opacity:0;transform:translateY(-90px)}}

.figure{position:absolute;bottom:30%;transform:translateX(-50%);z-index:2;
  filter:drop-shadow(0 10px 18px rgba(0,0,0,.85))}
.figure svg{display:block}
.figure.idle{animation:sway 5.2s ease-in-out infinite}
.figure.idle.b{animation-duration:6.1s;animation-delay:-1.4s}
.figure.idle.c{animation-duration:4.7s;animation-delay:-2.6s}
.figure.idle.d{animation-duration:5.8s;animation-delay:-3.7s}
@keyframes sway{0%,100%{transform:translateX(-50%) rotate(-.5deg) translateY(0)}
  50%{transform:translateX(-50%) rotate(.5deg) translateY(-3px)}}
.eyeglow{animation:eyeFlick 4.6s steps(1) infinite}
@keyframes eyeFlick{0%,86%,100%{opacity:1}88%{opacity:.15}90%{opacity:1}
  93%{opacity:.3}95%{opacity:1}}

.vig{position:absolute;inset:0;pointer-events:none;z-index:4;
  box-shadow:inset 0 0 150px 46px #000, inset 0 0 50px 4px rgba(0,0,0,.45)}
.grain{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:.055;
  background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px);
  animation:grainShift .5s steps(3) infinite}
@keyframes grainShift{0%{transform:translateY(0)}33%{transform:translateY(-1px)}
  66%{transform:translateY(1px)}}
.room.rumble{animation:rumble .36s ease-out}
@keyframes rumble{0%{transform:translate(0,0)}18%{transform:translate(-2px,2px)}
  36%{transform:translate(3px,-1px)}54%{transform:translate(-2px,-2px)}
  72%{transform:translate(2px,1px)}100%{transform:translate(0,0)}}

/* sahne perdesi dalgalanması */
.curtain{transform-origin:top center;animation:curtSway 7s ease-in-out infinite}
.curtain.r{animation-delay:-3.2s}
@keyframes curtSway{0%,100%{transform:skewX(0deg)}50%{transform:skewX(.7deg)}}
/* tavan lambası titremesi */
.lampglow{animation:lampFlick 6.5s steps(1) infinite}
@keyframes lampFlick{0%,70%,100%{opacity:.9}72%{opacity:.25}74%{opacity:.9}
  81%{opacity:.4}83%{opacity:.9}}
/* tavan pervanesi */
.fanblades{transform-origin:center;animation:fanSpin 1.6s linear infinite}
@keyframes fanSpin{to{transform:rotate(360deg)}}

/* ---------- altyazı ---------- */
#subs{position:absolute;left:0;right:0;bottom:4%;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;gap:6px;pointer-events:none;padding:0 4%;
  max-height:34%}
.sub{max-width:min(760px,92%);padding:7px 15px;border-radius:3px;
  background:rgba(4,5,7,.88);line-height:1.42;text-align:center;
  animation:subIn .22s ease-out}
@keyframes subIn{0%{opacity:0;transform:translateY(7px)}100%{opacity:1;transform:none}}
.sub.left{align-self:flex-start;text-align:left}
.sub.right{align-self:flex-end;text-align:right}
.sub .who{display:block;font-family:var(--f-michael);font-size:9.5px;letter-spacing:.24em;
  text-transform:uppercase;opacity:.55;margin-bottom:3px}
.sub .txt{display:block}

.fx-machine .txt{font-family:var(--f-machine);text-transform:uppercase;
  letter-spacing:.13em;font-size:clamp(17px,2.5vw,25px)}
.fx-child .txt{font-family:var(--f-child);text-transform:lowercase;
  font-size:clamp(19px,2.8vw,28px);letter-spacing:.01em;
  transform:rotate(-.7deg);transform-origin:left center}
.fx-jesse .txt{font-family:var(--f-jesse);text-transform:lowercase;
  font-size:clamp(16px,2.3vw,22px);font-weight:600}
.fx-cold .txt{font-family:var(--f-michael);font-size:clamp(15px,2.1vw,20px);
  letter-spacing:.015em}
.fx-type .txt{font-family:var(--f-type);font-size:clamp(14px,2vw,19px);letter-spacing:.03em}
.fx-child .ch{display:inline-block}

/* ---------- ofis ---------- */
#office .room{cursor:crosshair}

/* kapı boşluğu: içinde koridor görünüyor */
.doorway{position:absolute;top:9%;bottom:26%;width:20%;overflow:hidden;
  background:#020304;border:1px solid #171b22;
  box-shadow:inset 0 0 40px 12px rgba(0,0,0,.9);z-index:2}
.doorway.l{left:1.5%} .doorway.r{right:1.5%}
.doorway .hallbg{position:absolute;inset:0}
.doorway .hallbg svg{width:100%;height:100%;display:block}
.doorway .lbl{position:absolute;top:5px;left:0;right:0;text-align:center;font-size:9px;
  letter-spacing:.2em;color:#39404b;z-index:6}

/* kapı çerçevesi ve uyarı lambası */
.dframe{position:absolute;inset:0;border:3px solid #14181f;pointer-events:none;z-index:7}
.warnlamp{position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:34%;height:5px;background:#1b1f26;z-index:8;border-radius:0 0 3px 3px}
.warnlamp.on{background:var(--c-bad);box-shadow:0 0 16px 3px rgba(210,86,74,.7);
  animation:warnBlink .62s steps(1) infinite}
@keyframes warnBlink{0%,49%{opacity:1}50%,100%{opacity:.25}}

/* PANJUR — lamel lamel, çarpma ve sekme ile */
.shutter{position:absolute;left:0;right:0;top:0;height:100%;z-index:5;
  transform:translateY(-101%);will-change:transform;
  filter:drop-shadow(0 6px 12px rgba(0,0,0,.8))}
.shutter .slat{height:7.6%;position:relative;
  background:linear-gradient(#333a45 0%,#232932 38%,#1b212a 62%,#2b323d 100%);
  border-top:1px solid #454f5d;border-bottom:1px solid #0d1116}
.shutter .slat::after{content:"";position:absolute;left:0;right:0;top:32%;height:1px;
  background:rgba(255,255,255,.055)}
.shutter .rail{position:absolute;top:0;bottom:0;width:5px;background:linear-gradient(90deg,#3b434f,#171c23);
  z-index:2}
.shutter .rail.l{left:0} .shutter .rail.r{right:0}
.shutter .lip{height:9%;background:repeating-linear-gradient(45deg,
    #b9962f 0 9px,#171b22 9px 18px);border-top:2px solid #5b5334;
  box-shadow:0 3px 10px rgba(0,0,0,.85)}
.shutter.down{animation:shutClose .38s cubic-bezier(.3,.85,.25,1) forwards}
.shutter.up{animation:shutOpen .34s cubic-bezier(.5,0,.75,.4) forwards}
@keyframes shutClose{0%{transform:translateY(-101%)}
  70%{transform:translateY(1.5%)}84%{transform:translateY(-2.5%)}
  93%{transform:translateY(.8%)}100%{transform:translateY(0)}}
@keyframes shutOpen{0%{transform:translateY(0)}12%{transform:translateY(2%)}
  100%{transform:translateY(-101%)}}

/* kapı tozu */
.dust{position:absolute;left:0;right:0;bottom:0;height:30%;pointer-events:none;z-index:6}
.dust i{position:absolute;bottom:3px;width:3px;height:3px;border-radius:50%;
  background:#9a8f70;opacity:0}
.dust.go i{animation:dustPuff .85s ease-out}
@keyframes dustPuff{
  0%{opacity:0;transform:translate(0,0) scale(.6)}
  12%{opacity:.7}
  100%{opacity:0;transform:translate(var(--dx,0),-34px) scale(1.9)}}

.hallLight{position:absolute;inset:0;z-index:4;opacity:0;transition:opacity .09s;
  background:radial-gradient(120% 90% at 50% 40%,rgba(255,246,214,.26),rgba(255,246,214,.05) 62%,transparent 78%)}
.hallLight.on{opacity:1;animation:hallBuzz .16s steps(2) 2}
@keyframes hallBuzz{0%{opacity:.4}50%{opacity:1}100%{opacity:1}}

/* masa */
.deskwrap{position:absolute;left:0;right:0;bottom:0;height:34%;z-index:3;pointer-events:none}
.deskwrap svg{width:100%;height:100%;display:block}

#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
  gap:10px;padding:10px 14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
#hud .box{background:rgba(4,5,7,.72);border:1px solid var(--line);padding:6px 10px}
#hud b{color:#fff;font-weight:600;letter-spacing:.06em}
.use{letter-spacing:.05em;color:#5aa06a}
.use[data-lvl="3"]{color:#e0b02e} .use[data-lvl="4"]{color:#e08a2e}
.use[data-lvl="5"],.use[data-lvl="6"]{color:var(--c-bad)}
.meter{height:5px;width:96px;background:#1a1e26;margin-top:5px;position:relative}
.meter i{position:absolute;inset:0;width:0;background:#7fa8c9;transition:width .2s linear}
.meter.warn i{background:var(--c-bad)}
.meter.gold i{background:var(--c-golden)}

#ctrls{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;
  gap:6px;padding:10px;flex-wrap:wrap}
.cbtn{background:rgba(10,13,18,.9);border:1px solid var(--line);padding:8px 12px;
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.cbtn.active{border-color:#6d7e93;color:#fff}
.cbtn[data-on="1"]{border-color:#5e7f9c;color:#fff;background:#111821}
.cbtn:hover{color:#fff}

/* kamera */
.camview{position:absolute;inset:0;background:#05070a;padding:44px 18px 60px;
  display:flex;flex-direction:column;gap:8px;z-index:9;
  animation:camOn .28s ease-out}
@keyframes camOn{0%{opacity:0;transform:translateY(9px) scaleY(.94);filter:brightness(3)}
  40%{filter:brightness(1.5)}100%{opacity:1;transform:none;filter:none}}
.camstatic{position:absolute;inset:0;pointer-events:none;opacity:.09;
  background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 2px);
  animation:grainShift .34s steps(3) infinite}
.camscan{position:absolute;left:0;right:0;height:120px;pointer-events:none;z-index:3;
  background:linear-gradient(rgba(255,255,255,0),rgba(180,220,255,.05),rgba(255,255,255,0));
  animation:scan 5.5s linear infinite}
@keyframes scan{0%{top:-120px}100%{top:100%}}
.camflash{position:absolute;inset:0;pointer-events:none;background:#cfe3ff;opacity:0;z-index:4}
.camflash.go{animation:camFlash .22s ease-out}
@keyframes camFlash{0%{opacity:.22}100%{opacity:0}}
.camrooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:7px;
  position:relative;z-index:2}
.cr{border:1px solid #1c212a;background:#080a0e;padding:9px 10px;min-height:74px;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#5c6472;text-align:left}
.cr.here{border-color:#5e7f9c;color:#cfd4dc;background:#0c1219}
.cr .occ{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.cr .dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 8px currentColor}
.boxwrap{position:relative;z-index:2;border:1px solid #2a2f38;background:#080a0e;padding:10px 12px}

/* koridor (çıkış) */
.corridor{position:absolute;inset:0;background:#04060a;overflow:hidden}
.corridor .cbg{position:absolute;inset:0}
.corridor .cbg svg{width:100%;height:100%;display:block}
.walker{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);z-index:3;
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.9))}
.walker.moving{animation:bob .42s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0) rotate(-1deg)}
  50%{transform:translateX(-50%) translateY(-5px) rotate(1deg)}}
.progbar{position:absolute;left:8%;right:8%;bottom:8%;height:6px;background:#161a21}
.progbar i{position:absolute;inset:0;width:0;background:#7fa8c9}
.watcheye{position:absolute;top:16%;left:50%;transform:translateX(-50%);
  font-family:var(--f-machine);letter-spacing:.3em;font-size:15px;color:#3a414d}
.watcheye.on{color:var(--c-bad);text-shadow:0 0 18px rgba(210,86,74,.6)}

/* jumpscare */
#scare{position:absolute;inset:0;background:#000;display:flex;align-items:center;
  justify-content:center;z-index:60;animation:scareIn .12s steps(2)}
@keyframes scareIn{0%{background:#3a0d0a}100%{background:#000}}
#scare .who{animation:scareShake .09s steps(2) infinite, scarePush .5s cubic-bezier(.1,.9,.2,1)}
@keyframes scareShake{0%{transform:translate(-5px,3px) rotate(-1.4deg)}
  50%{transform:translate(6px,-4px) rotate(1.6deg)}100%{transform:translate(-4px,-2px) rotate(-1deg)}}
@keyframes scarePush{0%{scale:.35;filter:brightness(3)}100%{scale:1;filter:none}}
#scare .msg{font-family:var(--f-machine);text-transform:uppercase;letter-spacing:.22em;
  color:var(--c-bad);font-size:clamp(20px,5vw,40px)}
.room.blackout{animation:blackout .5s steps(2) infinite}
@keyframes blackout{0%,100%{filter:brightness(.22)}50%{filter:brightness(.3)}}

/* kart / metin ekranları */
.card{width:min(720px,92vw);text-align:center}
.card h2{font-family:var(--f-machine);letter-spacing:.2em;text-transform:uppercase;
  font-size:clamp(18px,3.4vw,28px);color:#e6e2d8;margin:0 0 14px}
.card p{color:var(--dim);line-height:1.66;margin:8px 0}
.card .beat{font-family:var(--f-child);font-size:clamp(18px,3vw,26px);color:var(--c-puppet);
  margin:22px 0 6px}
.hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:10.5px;
  letter-spacing:.16em;text-transform:uppercase;color:#4a515e}

/* gazete */
.paper{background:#ded8c9;color:#15130f;padding:26px 24px;width:min(660px,92vw);
  font-family:var(--f-news);box-shadow:0 20px 70px rgba(0,0,0,.8)}
.paper .kicker{font-size:10px;letter-spacing:.28em;text-transform:uppercase;
  border-bottom:1px solid #15130f;padding-bottom:7px;margin-bottom:14px;
  display:flex;justify-content:space-between;font-family:var(--f-michael)}
.paper h3{font-size:clamp(21px,4.2vw,34px);margin:0 0 10px;line-height:1.18}
.paper .lede{font-size:14px;line-height:1.62;color:#3a352c;margin:0}
.paper .rule{height:1px;background:#15130f33;margin:14px 0}

/* telefon */
.phone{width:min(300px,80vw);border:1px solid #2a2f38;background:#0b0e13;
  padding:22px 18px;text-align:center;border-radius:16px}
.phone .name{font-family:var(--f-michael);font-size:26px;color:#fff;letter-spacing:.02em}
.phone .st{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  margin-top:8px;min-height:16px}

.center-line{font-family:var(--f-michael);color:var(--c-michael);
  font-size:clamp(22px,4vw,34px);letter-spacing:.02em}

@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}
</style>
</head>
<body>
<div id="stage"></div>

<script>
"use strict";
/* ==========================================================================
   0. KONUŞANLAR — renk + yazı tipi (tasarım defteri §8)
   ========================================================================== */
const SPEAK = {
  jesse  : {name:"JESSE",         color:"var(--c-jesse)",   fx:"fx-jesse"},
  jesseOld:{name:"JESSE / 2023",  color:"var(--c-jesse)",   fx:"fx-cold"},
  michael: {name:"MICHAEL",       color:"var(--c-michael)", fx:"fx-cold"},
  gil    : {name:"G. MARLOW — LOG",color:"var(--c-gil)",    fx:"fx-type"},
  // ruhlar: turns = hangi gecenin SONUNDA çocuk el yazısına dönüyorlar
  freddy : {name:"FREDDY",  color:"var(--c-freddy)", soul:true, turns:4},
  bonnie : {name:"BONNIE",  color:"var(--c-bonnie)", soul:true, turns:2},
  chica  : {name:"CHICA",   color:"var(--c-chica)",  soul:true, turns:3},
  foxy   : {name:"FOXY",    color:"var(--c-foxy)",   soul:true, turns:4},
  golden : {name:"???",     color:"var(--c-golden)", soul:true, turns:99},
  puppet : {name:"",        color:"var(--c-puppet)", soul:true, turns:99}
};
const SOULNAME = {freddy:"Gabriel",bonnie:"Jeremy",chica:"Susie",foxy:"Fritz",golden:"Cassidy"};

function fxFor(id, night){
  const s = SPEAK[id];
  if (!s.soul) return s.fx;
  return (night > s.turns) ? "fx-child" : "fx-machine";
}

/* ==========================================================================
   1. SES — dosya yok, hepsi WebAudio ile üretiliyor
   ========================================================================== */
const A = (()=>{
  let ctx=null, hum=null, on=true;
  const start=()=>{ if(!ctx){ try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} }
                    if(ctx&&ctx.state==="suspended") ctx.resume(); };
  const gain=(v,t)=>{ const g=ctx.createGain(); g.gain.value=on?v:0; g.connect(ctx.destination); return g; };
  const tone=(freq,dur,type="sine",vol=.1,slide=0)=>{
    if(!ctx||!on) return;
    const o=ctx.createOscillator(), g=gain(vol);
    o.type=type; o.frequency.value=freq;
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,freq*slide), ctx.currentTime+dur);
    g.gain.setValueAtTime(vol,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0008, ctx.currentTime+dur);
    o.connect(g); o.start(); o.stop(ctx.currentTime+dur+.02);
    o.onended = ()=>{ try{ o.disconnect(); g.disconnect(); }catch(e){} };  // düğümleri bırak
  };
  // gürültü tamponları önbellekte: altyazı motoru harf başına click() çağırıyor,
  // her seferinde yeni buffer üretmek boşuna ayırma
  const nbuf = new Map();
  const noiseBuf=(dur)=>{
    const key = dur.toFixed(2);
    let b = nbuf.get(key);
    if (!b){
      const n = Math.max(1, (ctx.sampleRate*dur)|0);
      b = ctx.createBuffer(1,n,ctx.sampleRate);
      const d = b.getChannelData(0);
      for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
      nbuf.set(key,b);
    }
    return b;
  };
  const noise=(dur,vol=.18,hp=400)=>{
    if(!ctx||!on) return;
    const s=ctx.createBufferSource(); s.buffer=noiseBuf(dur);
    const f=ctx.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
    const g=gain(vol);
    s.connect(f); f.connect(g); s.start();
    s.onended = ()=>{ try{ s.disconnect(); f.disconnect(); g.disconnect(); }catch(e){} };
  };
  return {
    init(){ start(); },
    set(v){ on=v; if(!v&&hum){hum.stop&&hum.stop();hum=null;} },
    get on(){ return on; },
    fanOn(){
      if(!ctx||!on||hum) return;
      const o=ctx.createOscillator(), f=ctx.createBiquadFilter(), g=gain(.035);
      o.type="sawtooth"; o.frequency.value=58;
      f.type="lowpass"; f.frequency.value=200;
      o.connect(f); f.connect(g); o.start(); hum=o;
    },
    fanOff(){ if(hum){ try{hum.stop();}catch(e){} hum=null; } },
    click(){ noise(.05,.10,1400); },
    doorMove(){ tone(90,.30,"square",.09,.55); noise(.30,.06,260); },
    slam(){ tone(58,.34,"square",.17,.42); noise(.20,.15,120); },
    buzz(){ tone(120,.14,"square",.035); tone(240,.14,"square",.02); },
    step(){ noise(.06,.05,250); },
    ping(){ tone(880,.09,"triangle",.06); },
    bad(){ tone(120,.5,"sawtooth",.14,.4); noise(.5,.12,200); },
    scare(){ noise(.85,.34,120); tone(70,.9,"sawtooth",.22,.35); },
    chime(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,1.1,"triangle",.09),i*150)); },
    // müzik kutusu: kurulu oldukça hızlı ve tiz, boşaldıkça yavaşlar ve pesleşir
    boxNote(step, wind){
      const mel=[659,587,523,587,659,659,659,587,587,587,659,784,784];
      const p = .55 + wind*.45;               // 0 boş → çok pes
      tone(mel[step%mel.length]*p, .42, "triangle", .055 + wind*.03);
    }
  };
})();

const stage = document.getElementById("stage");
const el = (tag, cls, html) => { const d=document.createElement(tag);
  if(cls) d.className=cls; if(html!=null) d.innerHTML=html; return d; };
const wait = ms => new Promise(r=>setTimeout(r,ms));
// Set kullanılıyor: biten zamanlayıcılar kendini siliyor, dizi sonsuza kadar büyümüyor
// (altyazı motoru harf başına bir zamanlayıcı açıyor, bu olmadan binlerce ölü kayıt birikiyordu)
const timers = new Set();
const later = (fn,ms) => {
  const t = setTimeout(()=>{ timers.delete(t); fn(); }, ms);
  timers.add(t); return t;
};
const clearTimers = () => { timers.forEach(clearTimeout); timers.clear(); };
let rafs = [];
const loop = fn => { let id; const step=t=>{ if(fn(t)!==false) id=requestAnimationFrame(step); };
  id=requestAnimationFrame(step); rafs.push(()=>cancelAnimationFrame(id)); };
const stopLoops = () => { rafs.forEach(f=>f()); rafs=[]; };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

function eyes(cx1, cx2, cy, r, iris, look=0){
  return `<g class="eyeglow">
    <ellipse cx="${cx1}" cy="${cy}" rx="${r}" ry="${r*1.06}" fill="#efeadd"/>
    <ellipse cx="${cx2}" cy="${cy}" rx="${r}" ry="${r*1.06}" fill="#efeadd"/>
    <circle cx="${cx1+look}" cy="${cy}" r="${r*.55}" fill="${iris}"/>
    <circle cx="${cx2+look}" cy="${cy}" r="${r*.55}" fill="${iris}"/>
    <circle cx="${cx1+look}" cy="${cy}" r="${r*.27}" fill="#08090b"/>
    <circle cx="${cx2+look}" cy="${cy}" r="${r*.27}" fill="#08090b"/>
    <circle cx="${cx1+look-r*.2}" cy="${cy-r*.24}" r="${r*.13}" fill="#fff" opacity=".85"/>
    <circle cx="${cx2+look-r*.2}" cy="${cy-r*.24}" r="${r*.13}" fill="#fff" opacity=".85"/>
  </g>`;
}
function teeth(x, y, w, n=6){
  let t=""; const s=w/n;
  for(let i=0;i<n;i++) t+=`<rect x="${x+i*s+1}" y="${y}" width="${s-2}" height="7" rx="1.5" fill="#e8e3d4"/>`;
  return t;
}

/* ==========================================================================
   2b. MEKAN — Freddy Fazbear's Pizza, elle çizilmiş.
   Zemin gerçek perspektifle üretiliyor: kaçış noktası (800,470),
   derinlik s(t) = (1-t)^2.3 ile hem x hem y aynı anda küçülüyor.
   ========================================================================== */
const W = 1600, H = 1000, VPX = 800, VPY = 470, FLOOR_Y = 1000;

function sAt(t){ return Math.pow(1-t, 2.3); }
function pt(x, t){ const s = sAt(t);
  return [ VPX + (x - VPX)*s, VPY + (FLOOR_Y - VPY)*s ]; }

/* siyah-beyaz damalı zemin */
function checkerFloor(){
  const ROWS = 11, COLS = 16, half = COLS/2, cell = 260;
  let out = `<rect x="0" y="${VPY}" width="${W}" height="${H-VPY}" fill="#0a0c10"/>`;
  for (let r=0; r<ROWS; r++){
    const t0 = r/ROWS, t1 = (r+1)/ROWS;
    for (let c=0; c<COLS; c++){
      const x0 = (c-half)*cell + VPX, x1 = (c+1-half)*cell + VPX;
      const [ax,ay] = pt(x0,t0), [bx,by] = pt(x1,t0);
      const [cx,cy] = pt(x1,t1), [dx,dy] = pt(x0,t1);
      const light = (r+c)%2===0;
      const fade = 0.30 + 0.70*sAt(t0);
      const col = light ? `rgba(140,150,166,${(0.46*fade).toFixed(3)})`
                        : `rgba(11,14,19,${(0.80*fade).toFixed(3)})`;
      out += `<path d="M${ax.toFixed(1)} ${ay.toFixed(1)} L${bx.toFixed(1)} ${by.toFixed(1)}
               L${cx.toFixed(1)} ${cy.toFixed(1)} L${dx.toFixed(1)} ${dy.toFixed(1)} Z" fill="${col}"/>`;
    }
  }
  return out;
}

/* duvar: lambri + bordür + kirli boya */
function wall(){
  return `
    <rect x="0" y="0" width="${W}" height="${VPY}" fill="#242c3a"/>
    <rect x="0" y="0" width="${W}" height="${VPY}" fill="url(#wallGrad)"/>
    <rect x="0" y="${VPY-118}" width="${W}" height="118" fill="#2d3547"/>
    <rect x="0" y="${VPY-124}" width="${W}" height="9" fill="#3d3020"/>
    <rect x="0" y="${VPY-8}" width="${W}" height="8" fill="#12151b"/>
    ${Array.from({length:17},(_,i)=>
      `<rect x="${i*100+6}" y="${VPY-112}" width="3" height="104" fill="#1b202a"/>`).join("")}
    <g opacity=".5">${Array.from({length:9},(_,i)=>
      `<path d="M${i*190+40} ${VPY-124} l24 -${60+((i*37)%70)}" stroke="#141922"
        stroke-width="3" fill="none"/>`).join("")}</g>`;
}

/* zikzak bayrak dizisi */
function bunting(y, x0, x1, n){
  let o = `<path d="M${x0} ${y} Q${(x0+x1)/2} ${y+34} ${x1} ${y}" stroke="#2b3240" stroke-width="3" fill="none"/>`;
  const cols = ["#c2447a","#3f7fa8","#e0b02e","#5aa06a","#a8553f"];
  for (let i=0;i<n;i++){
    const f = (i+.5)/n, cx = x0 + (x1-x0)*f;
    const cy = y + 34*4*f*(1-f);
    o += `<path d="M${cx-17} ${cy} L${cx+17} ${cy} L${cx} ${cy+34} Z"
            fill="${cols[i%cols.length]}" opacity=".55"/>`;
  }
  return o;
}

/* parti masası — perspektifte, üstünde bardak, tabak, şapka */
function table(x, t, seed=0){
  const s = sAt(t), [px,py] = pt(x,t);
  const rw = 210*s, rh = 62*s, top = py - 150*s;
  const R = (n)=> ((seed*37 + n*53) % 100)/100;
  let o = `<g>
    <ellipse cx="${px}" cy="${py-4}" rx="${rw*1.05}" ry="${rh*.55}" fill="#000" opacity=".45"/>
    <path d="M${px-rw*.13} ${top} h${rw*.26} l${rw*.07} ${150*s} h-${rw*.4} z" fill="#20252f"/>
    <ellipse cx="${px}" cy="${py}" rx="${rw*.42}" ry="${rh*.32}" fill="#252b36"/>
    <ellipse cx="${px}" cy="${top+10*s}" rx="${rw}" ry="${rh}" fill="#2f3542"/>
    <ellipse cx="${px}" cy="${top}" rx="${rw}" ry="${rh}" fill="#3c4454"/>
    <ellipse cx="${px}" cy="${top}" rx="${rw*.86}" ry="${rh*.82}" fill="#465063"/>
    <ellipse cx="${px}" cy="${top}" rx="${rw*.86}" ry="${rh*.82}" fill="#465063"/>`;
  // tabaklar
  for (let i=0;i<3;i++){
    const a = R(i)*6.28, dx = Math.cos(a)*rw*.55, dy = Math.sin(a)*rh*.5;
    o += `<ellipse cx="${px+dx}" cy="${top+dy}" rx="${26*s}" ry="${10*s}" fill="#d9d3c4" opacity=".8"/>`;
  }
  // bardaklar
  for (let i=0;i<2;i++){
    const a = R(i+5)*6.28, dx = Math.cos(a)*rw*.4, dy = Math.sin(a)*rh*.35;
    o += `<path d="M${px+dx-9*s} ${top+dy-30*s} h${18*s} l-${3*s} ${30*s} h-${12*s} z"
            fill="#c2447a" opacity=".75"/>`;
  }
  // parti şapkası
  const a2 = R(9)*6.28, hx = px+Math.cos(a2)*rw*.62, hy = top+Math.sin(a2)*rh*.5;
  o += `<path d="M${hx} ${hy-46*s} L${hx-15*s} ${hy} L${hx+15*s} ${hy} Z" fill="#e0b02e" opacity=".85"/>
        <circle cx="${hx}" cy="${hy-48*s}" r="${5*s}" fill="#f0eadb" opacity=".85"/>`;
  return o + `</g>`;
}

/* ==========================================================================
   3. ALTYAZI MOTORU — sistemin yıldızı
   ========================================================================== */
function makeSubs(parent){
  const box = el("div"); box.id="subs"; parent.appendChild(box);
  let queue = Promise.resolve();

  function render(line){
    const {who, text, night, pos} = line;
    const sp = SPEAK[who], fx = fxFor(who, night||1);
    const d = el("div", "sub "+fx+(pos?" "+pos:""));
    d.style.color = sp.color;
    if (sp.name) d.appendChild(el("span","who",sp.name));
    const t = el("span","txt"); d.appendChild(t);
    box.appendChild(d);
    while (box.children.length > 2) box.removeChild(box.firstChild);
    return {d, t, fx};
  }

  // el yazısında her harf kendi açısında duruyor — yazı bitince de öyle KALIYOR
  function childText(t, chars, upTo){
    t.innerHTML = "";
    for (let k=0;k<upTo;k++){
      const s = el("span","ch", chars[k]===" " ? "&nbsp;" : chars[k]);
      s.style.transform = `rotate(${((k*37)%7)-3}deg) translateY(${((k*53)%5)-2}px)`;
      t.appendChild(s);
    }
  }

  // harf harf açılış. makine yazısı arada bozuluyor, el yazısı hafif eğri duruyor.
  function reveal(t, text, fx){
    return new Promise(done=>{
      const chars = [...text];
      let i = 0;
      const GLITCH = "#%&@*+/\\";
      const tick = () => {
        if (i >= chars.length){
          if (fx === "fx-child" && !reduced) childText(t, chars, chars.length);
          else t.textContent = text;
          return done();
        }
        i++;
        if (fx === "fx-child" && !reduced){
          childText(t, chars, i);
        } else if (fx === "fx-machine" && !reduced && Math.random()<.25){
          t.textContent = chars.slice(0,i-1).join("") + GLITCH[(Math.random()*GLITCH.length)|0];
          later(()=>{ t.textContent = chars.slice(0,i).join(""); }, 45);
        } else {
          t.textContent = chars.slice(0,i).join("");
        }
        if (chars[i-1] !== " " && i%2===0) A.click();
        later(tick, fx==="fx-machine" ? 30 : 26);
      };
      tick();
    });
  }

  return {
    el: box,
    say(who, text, opts={}){
      queue = queue.then(async ()=>{
        const {t, fx} = render({who, text, night:opts.night, pos:opts.pos});
        await reveal(t, text, fx);
        await wait(opts.hold != null ? opts.hold : Math.min(2600, 700 + text.length*42));
      });
      return queue;
    },
    beat(ms){ queue = queue.then(()=>wait(ms)); return queue; },
    clear(){ box.innerHTML=""; },
    done(){ return queue; }
  };
}

const OPENER_SET = {1:"dining", 2:"arcade", 3:"dining", 4:"cove", 5:"dining"};

function sceneOpener(){
  const cfg = OPENERS[S.night];
  const s = screen("opener");
  const room = roomBox(OPENER_SET[S.night] || "dining");

  const head = el("div","box");
  head.style.cssText="position:absolute;top:10px;left:14px;font-size:10.5px;letter-spacing:.16em;"+
    "text-transform:uppercase;color:#5c6472;background:rgba(4,5,7,.7);border:1px solid #22262e;padding:6px 10px;z-index:5";
  head.innerHTML = `Gece ${S.night} &nbsp;·&nbsp; ${cfg.time}<br><span style="color:#3d4450">${cfg.place}</span>`;
  room.appendChild(head);

  // figürler — hafif salınım, her biri kendi temposunda
  const figs = [];
  const idleCls = ["","b","c","d"];
  cfg.cast.forEach(([kind, xPct], i)=>{
    const f = el("div","figure idle "+idleCls[i%4], figure(kind, 210));
    f.style.left = xPct+"%";
    f.style.filter = "brightness(.2) drop-shadow(0 10px 18px rgba(0,0,0,.9))";
    room.appendChild(f); figs.push({kind, node:f, x:xPct});
  });
  if (cfg.standing){
    const j = el("div","figure", figure("jesse",168,true));
    j.style.left="50%"; j.style.bottom="28%"; j.style.opacity=".95";
    j.style.zIndex="3";
    room.appendChild(j);
  }

  // fener — boş zemine bakarak başlıyor, kimsenin üstünde değil
  const beam = el("div","beam");
  beam.style.left="50%"; beam.style.top="92%";
  if (!cfg.standing) room.appendChild(beam);

  // görülme ölçeri
  const seen = el("div");
  seen.style.cssText="position:absolute;top:12px;right:14px;z-index:5;text-align:right;"+
    "font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#5c6472";
  seen.innerHTML = `Fark edilme<div class="meter warn" style="margin-left:auto"><i></i></div>`;
  const seenBar = seen.querySelector("i");
  if (!cfg.standing) room.appendChild(seen);

  s.appendChild(room);
  if (S.night===1 && !cfg.standing)
    s.appendChild(el("div","hint","Fareyi oynat — feneri onların üstünde tutma. Kıpırdamazsan daha çok duyarsın."));
  else if (cfg.standing)
    s.appendChild(el("div","hint","Bu gece saklanmıyorsun."));
  else
    s.appendChild(el("div","hint","Feneri onların üstünde tutma."));
  show(s);
  A.init(); A.fanOn();

  const subs = makeSubs(room);
  let exposure = 0, cut = false, mx=0.5, my=0.92, tPrev=0, moved=false;

  if (!cfg.standing){
    room.addEventListener("pointermove", e=>{
      const r = room.getBoundingClientRect();
      mx = (e.clientX-r.left)/r.width; my = (e.clientY-r.top)/r.height;
      beam.style.left = (mx*100)+"%"; beam.style.top = (my*100)+"%";
      moved = true;                      // fareye dokunmadıysan asla yakalanmazsın
    });
    loop(t=>{
      if (cut) return false;
      const dt = tPrev ? Math.min(70, t-tPrev) : 0; tPrev = t;
      let lit = 0;
      figs.forEach(f=>{
        const d = Math.abs(mx*100 - f.x);
        const near = moved && d < 12 && my > .24 && my < .80;
        // karanlıkta saydam değil, KARANLIK duruyorlar
        f.node.style.filter = near ? "brightness(1) drop-shadow(0 10px 18px rgba(0,0,0,.85))"
                            : (d<26 ? "brightness(.42) drop-shadow(0 10px 18px rgba(0,0,0,.9))"
                                    : "brightness(.2) drop-shadow(0 10px 18px rgba(0,0,0,.9))");
        if (near) lit++;
      });
      // saniye başına: ışık üstündeyse ~30, değilse -24 (kare hızından bağımsız)
      exposure = Math.max(0, exposure + (lit ? 30*lit : -24) * dt/1000);
      seenBar.style.width = Math.min(100, exposure) + "%";
      if (exposure >= 100 && !cut){
        cut = true; A.bad();
        subs.clear();
        room.appendChild(el("div",null,
          `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
           background:rgba(0,0,0,.86);z-index:20"><div style="font-family:var(--f-machine);
           letter-spacing:.2em;text-transform:uppercase;color:var(--c-bad);text-align:center;font-size:19px">
           Seni gördüler.<div style="color:#5c6472;font-size:12px;margin-top:10px">
           Gece bir oda yakından başlıyor.</div></div></div>`));
        later(()=>sceneOffice({penalty:true}), 2200);
        return false;
      }
    });
  }

  // replikler
  (async ()=>{
    await wait(cfg.standing ? 1200 : 2200);
    for (const [who, text, pos] of cfg.lines){
      if (cut) return;
      await subs.say(who, text, {night:S.night, pos});
      if (cut) return;
      await subs.beat(700);
    }
    if (cut) return;

    // gece 2: bonnie başını çevirir
    if (S.night===2){
      const b = figs.find(f=>f.kind==="bonnie");
      if (b){ b.node.style.transition="transform .9s ease"; b.node.style.transform="translateX(-50%) scaleX(-1)"; }
      await wait(1400);
      await subs.say("gil","(Bonnie başını oyun makinelerine çeviriyor. Nerede olduğunu biliyor. Gelmiyor.)",
                     {night:S.night, hold:2400});
    }
    if (S.night===5){
      await wait(700);
      await subs.say("gil","(Saat 12:00. İlk kez kimse hareket etmiyor.)",{night:5,hold:2200});
      A.boxNote(0,1); await wait(500); A.boxNote(1,1); await wait(500); A.boxNote(2,1);
      await subs.say("gil","(Koridordan bir müzik kutusu çalmaya başlıyor.)",{night:5,hold:2400});
    }
    S.openersHeard[S.night-1] = true;
    await wait(900);
    if (!cut) sceneOffice();
  })();
}

  room.appendChild(cams);

  // kontroller
  const ctr = el("div"); ctr.id="ctrls";
  ctr.innerHTML = `
    <button class="cbtn" id="bDL" data-on="0">A — Batı kapı</button>
    <button class="cbtn" id="bLL" data-on="0">Q — Batı ışık</button>
    <button class="cbtn" id="bCam" data-on="0">SPACE — Kamera</button>
    <button class="cbtn" id="bRL" data-on="0">E — Doğu ışık</button>
    <button class="cbtn" id="bDR" data-on="0">D — Doğu kapı</button>
    <button class="cbtn" id="bJack" data-on="1">J — Ceket</button>`;
  room.appendChild(ctr);

  s.appendChild(room);
  s.appendChild(el("div","hint","A/D kapı · Q/E ışık · SPACE kamera · J ceket · W müzik kutusunu kur"));
  show(s); A.init(); A.fanOn();

  const subs = makeSubs(room);

  /* --- durum --- */
  const lvl = [0,3,4,6,8,11][night];
  const G = {
    t:0, hour:0, power:100, cold:0, dead:false, over:false,
    doorL:false, doorR:false, lightL:false, lightR:false, camUp:false,
    box:100, boxOn: night>=2, winding:false,
    pos:{ bonnie:0, chica:0, freddy:0, foxy:0 },
    atDoor:{L:0,R:0}, excursionDone:false, paused:false,
    wasL:null, wasR:null, use:1, lastOpL:null, lastOpR:null
  };
  if (opt.penalty){ G.pos.bonnie=2; G.pos.chica=2; }

  const HOUR_MS = 21000;
  const $ = id => room.querySelector("#"+id);
  if (opt.startAtExcursion) later(()=>excursion(), 400);

  /* --- kamera odaları --- */
  const crWrap = $("crWrap");
  ROOMS.forEach(r=>{
    const c = el("button","cr"); c.dataset.room=r;
    c.innerHTML = `${r}<div class="occ"></div>`;
    c.onclick = ()=>{ A.click(); selectRoom(r); };
    crWrap.appendChild(c);
  });
  let selected = "Show Stage";
  function selectRoom(r){
    selected = r;
    crWrap.querySelectorAll(".cr").forEach(c=>c.classList.toggle("here", c.dataset.room===r));
    $("bwrap").hidden = (r !== "Prize Corner") || !G.boxOn;
    if (r === "Kitchen"){
      subs.clear();
      subs.say("gil","(CAM 6 — Kitchen. Kamera bozuk. Sadece ses var.)",{night,hold:1800});
    }
    if (r === "Pirate Cove" && G.pos.foxy < 3) G.pos.foxy = Math.max(0, G.pos.foxy-1);
  }
  selectRoom("Show Stage");

  // Kamera listesi eskiden HER KAREDE 11 odanın innerHTML'ini yeniden yazıyordu
  // (saniyede ~660 DOM yazımı). Artık sadece kamera açıkken ve konumlar
  // gerçekten değiştiğinde çiziliyor.
  const crCells = [...crWrap.querySelectorAll(".cr")]
    .map(c => ({ node:c, room:c.dataset.room, occ:c.querySelector(".occ") }));
  let camSig = "";
  function drawCams(force){
    if (!G.camUp && !force) return;
    const sig = G.pos.bonnie+","+G.pos.chica+","+G.pos.freddy+","+G.pos.foxy;
    if (sig === camSig && !force) return;
    camSig = sig;
    const where = {};
    for (const k in G.pos){
      const p = PATHS[k][Math.min(G.pos[k], PATHS[k].length-1)];
      (where[p] || (where[p] = [])).push(k);
    }
    for (const c of crCells){
      const here = (c.room === "Kitchen") ? null : where[c.room];
      const want = here ? here.join("") : "";
      if (c.last === want) continue;              // o oda değişmediyse dokunma
      c.last = want;
      c.occ.innerHTML = here
        ? here.map(k=>`<span class="dot" style="background:${SPEAK[k].color};color:${SPEAK[k].color}"></span>`).join("")
        : "";
    }
  }

  /* --- girdiler --- */
  // kapı: panjur iner, oda sarsılır, altından toz kalkar
  function door(side, open){
    const sh = side === "l" ? shutL : shutR;
    const d  = side === "l" ? dustL : dustR;
    sh.classList.remove("down","up");
    void sh.offsetWidth;                       // animasyonu yeniden tetikle
    sh.classList.add(open ? "up" : "down");
    A.doorMove();
    if (!open && !reduced){
      room.classList.remove("rumble"); void room.offsetWidth; room.classList.add("rumble");
      d.classList.remove("go"); void d.offsetWidth;
      later(()=>d.classList.add("go"), 250);
      later(()=>A.slam(), 250);
    }
  }

  const camFlash = cams.querySelector(".camflash");

  function toggle(k){
    if (G.over) return;
    if (k==="dl"){ G.doorL=!G.doorL; door("l", !G.doorL); $("bDL").dataset.on=G.doorL?1:0; }
    if (k==="dr"){ G.doorR=!G.doorR; door("r", !G.doorR); $("bDR").dataset.on=G.doorR?1:0; }
    if (k==="ll"){ G.lightL=!G.lightL; hallL.classList.toggle("on",G.lightL);
                   $("bLL").dataset.on=G.lightL?1:0; if(G.lightL) A.buzz(); }
    if (k==="rl"){ G.lightR=!G.lightR; hallR.classList.toggle("on",G.lightR);
                   $("bRL").dataset.on=G.lightR?1:0; if(G.lightR) A.buzz(); }
    if (k==="cam"){
      G.camUp=!G.camUp; A.click(); cams.hidden=!G.camUp; $("bCam").dataset.on=G.camUp?1:0;
      if (G.camUp){
        drawCams(true);                        // açılır açılmaz güncel görüntü
        if (!reduced && camFlash){
          camFlash.classList.remove("go"); void camFlash.offsetWidth; camFlash.classList.add("go");
        }
      }
    }
    if (k==="jack"){
      S.jacket=!S.jacket; A.step();
      $("hJack").textContent = S.jacket ? "ÜSTÜNDE" : "ÇIKARDIN";
      $("bJack").dataset.on = S.jacket?1:0;
      if(!S.jacket) subs.say("gil","(Ceket yerde. Daha yavaş geliyorlar — ama üşüyorsun.)",{night,hold:1600});
    }
  }
  $("bDL").onclick=()=>toggle("dl"); $("bDR").onclick=()=>toggle("dr");
  $("bLL").onclick=()=>toggle("ll"); $("bRL").onclick=()=>toggle("rl");
  $("bCam").onclick=()=>toggle("cam"); $("bJack").onclick=()=>toggle("jack");

  const keymap = {a:"dl",d:"dr",q:"ll",e:"rl"," ":"cam",j:"jack"};
  const onKey = ev=>{
    const k = ev.key.toLowerCase();
    if (k === "w"){ ev.preventDefault(); G.winding = true; return; }   // basılı tut
    if (ev.repeat) return;
    if (keymap[k]){ ev.preventDefault(); toggle(keymap[k]); }
  };
  const onKeyUp = ev=>{ if (ev.key.toLowerCase()==="w") G.winding = false; };
  window.addEventListener("keydown", onKey);
  window.addEventListener("keyup", onKeyUp);
  rafs.push(()=>{ window.removeEventListener("keydown", onKey);
                  window.removeEventListener("keyup", onKeyUp); });

  // Kurma: düğmeye basılı tut YA DA W'ye bas. Prize Corner kamerası açık olmalı.
  const wb = $("windBtn");
  const windOn = e=>{ e.preventDefault(); G.winding=true; }, windOff = ()=>{ G.winding=false; };
  wb.addEventListener("pointerdown", windOn);
  window.addEventListener("pointerup", windOff);
  rafs.push(()=>window.removeEventListener("pointerup", windOff));

  /* --- ölüm --- */
  function die(who, why){
    if (G.over) return; G.over=true; G.dead=true;
    A.scare();
    const sc = el("div"); sc.id="scare";
    sc.innerHTML = `<div style="text-align:center">
      <div class="who" style="margin-bottom:14px">${figure(who,300)}</div>
      <div class="msg">${why}</div>
      <div style="color:#5c6472;font-size:12px;letter-spacing:.16em;margin-top:14px">
        Gece ${night} — tekrar</div></div>`;
    room.appendChild(sc);
    later(()=>{ sceneOpener(); }, 2600);
  }

  /* --- ÇIKIŞ: koridor mini oyunu (3 AM) --- */
  const TARGETS = {1:"Backstage",2:"Supply Closet",3:"Kitchen",4:"Pirate Cove",5:"West Wall"};
  function excursion(){
    G.paused = true;
    const ov = el("div","corridor"); ov.style.zIndex="40";
    ov.innerHTML = `
      <div class="cbg">${buildCorridor()}</div>
      <div class="vig"></div>
      <div style="position:absolute;top:12px;left:0;right:0;text-align:center;font-size:10px;
        letter-spacing:.2em;text-transform:uppercase;color:#5c6472;z-index:5">
        ÇIKIŞ — ${TARGETS[night]} &nbsp;·&nbsp; babanın defterinden bir sayfa</div>
      <div class="watcheye" id="eye" style="z-index:5">— — —</div>
      <div class="walker" id="walk">${figure("jesse",150,S.jacket)}</div>
      <div class="progbar"><i id="prog"></i></div>
      <div style="position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:10.5px;
        letter-spacing:.16em;text-transform:uppercase;color:#4a515e">
        Basılı tut = yürü &nbsp;·&nbsp; kırmızıyken dur</div>`;
    room.appendChild(ov);

    let prog=0, walking=false, watching=false, caught=0, tNext=1400, seenFor=0;
    const eye = ov.querySelector("#eye"), bar = ov.querySelector("#prog"), wk = ov.querySelector("#walk");
    const dn = ()=>walking=true, up = ()=>walking=false;
    ov.addEventListener("pointerdown", dn);
    window.addEventListener("pointerup", up);
    const kd = e=>{ if(e.key===" "){e.preventDefault(); walking=true;} };
    const ku = e=>{ if(e.key===" ") walking=false; };
    window.addEventListener("keydown",kd); window.addEventListener("keyup",ku);
    const cleanup = ()=>{ window.removeEventListener("pointerup",up);
      window.removeEventListener("keydown",kd); window.removeEventListener("keyup",ku); };
    rafs.push(cleanup);

    let last = performance.now();
    loop(t=>{
      if (G.over) return false;
      const dt = Math.min(60, t-last); last = t;
      tNext -= dt;
      if (tNext <= 0){
        watching = !watching;
        tNext = watching ? (900 + Math.random()*900) : (1100 + Math.random()*1200);
        eye.classList.toggle("on", watching);
        eye.textContent = watching ? "● ● ●" : "— — —";
        if (watching) A.ping();
      }
      wk.classList.toggle("moving", walking && !reduced);
      if (walking){
        prog += dt*0.022;
        wk.style.bottom = (16 + prog*0.30) + "%";
        wk.style.scale = (1 - prog*0.0045).toFixed(3);
        // bakış açıldıktan sonra ~200ms tepki payı, sonra ~2sn'de dolar
        if (watching && seenFor > 200){ caught += dt*0.055; }
      } else {
        caught = Math.max(0, caught - dt*0.045);
      }
      seenFor = watching ? seenFor + dt : 0;
      G.power -= dt/1000 * 0.30;
      bar.style.width = Math.min(100, prog) + "%";
      bar.style.background = caught>50 ? "var(--c-bad)" : "#7fa8c9";
      if (caught >= 100){ cleanup(); die(night>=4?"foxy":"bonnie","Koridorda yakalandın."); return false; }
      if (prog >= 100){
        cleanup(); G.excursionDone = true;
        ov.innerHTML = `<div style="position:absolute;inset:0;display:flex;align-items:center;
          justify-content:center;text-align:center;padding:20px">
          <div><div style="font-family:var(--f-type);color:var(--c-gil);font-size:15px;
          max-width:480px;line-height:1.7">${LOGPAGE[night]}</div></div></div>`;
        later(()=>{ ov.remove(); G.paused=false; }, 4200);
        return false;
      }
    });
  }
  const LOGPAGE = {
    1:"SERVICE LOG — 03/12/87 — G. MARLOW<br>Suit #4 springlocks show wear on the<br>left shoulder. Nobody logged a fitting.<br>Somebody has been wearing it.",
    2:"SERVICE LOG — 03/19/87<br>Asked about after-hours access again.<br>Told to stop asking. — <b>JEREMY</b>",
    3:"SERVICE LOG — 04/02/87<br>The room behind the west wall is not<br>on any floor plan I was given. — <b>SUSIE</b>",
    4:"SERVICE LOG — 04/11/87<br>Second set of keys signed out at 11 PM,<br>six nights running. Not mine. — <b>FRITZ / GABRIEL</b>",
    5:"SERVICE LOG — 04/14/87 — LAST ENTRY<br>I gave management everything.<br>They gave the police my name.<br>The name on the second key card is —"
  };

  /* --- ana döngü --- */
  let last = performance.now(), moveAcc = 0, boxAcc = 0;
  loop(t=>{
    if (G.over) return false;
    const dt = Math.min(70, t - last); last = t;
    if (G.paused){ updateHud(); return; }

    G.t += dt;
    const hour = Math.floor(G.t / HOUR_MS);
    if (hour !== G.hour && hour <= 6){
      G.hour = hour; A.ping();
      if (hour === 3 && !G.excursionDone && !opt.noExcursion) excursion();
    }
    if (G.t >= HOUR_MS*6){ finishNight(); return false; }

    // güç — bir gece 126 sn. Kapıları gecenin yarısında kapalı tutan oyuncu
    // %45 civarı harcıyor, yani hata payı var. (Eski değerlerin ~1.6 katı sıkıydı.)
    G.use = 1 + (G.doorL?1:0) + (G.doorR?1:0) + (G.camUp?1:0)
              + (G.lightL?1:0) + (G.lightR?1:0);
    const drain = 0.14 + (G.doorL?0.26:0) + (G.doorR?0.26:0) + (G.camUp?0.16:0)
                + (G.lightL?0.12:0) + (G.lightR?0.12:0);
    G.power -= drain * dt/1000;
    if (G.power <= 0){ G.power=0; powerOut(); return false; }

    // ceket / soğuk
    if (S.jacket) G.cold = Math.max(0, G.cold - dt/1000*3.5);
    else          G.cold = Math.min(100, G.cold + dt/1000*4.5);

    // müzik kutusu
    if (G.boxOn){
      if (G.winding && G.camUp && selected==="Prize Corner"){
        G.box = Math.min(100, G.box + dt/1000*48);
      } else {
        // Dolu kutu gece 2de ~69sn, gece 5te ~48sn dayanıyor.
        // (Eskiden 25sn'de boşalıyordu — 126 saniyelik gecede imkânsızdı.)
        G.box -= dt/1000 * (1.00 + night*0.22);
      }
      boxAcc += dt;
      if (boxAcc > 620 - G.box*3){ boxAcc = 0; A.boxNote((G.t/620)|0, G.box/100); }
      if (G.box <= 0){ die("puppet","Müzik kutusu sustu."); return false; }
    }

    // animatronik hareketi
    moveAcc += dt;
    const step = Math.max(1800, 5200 - lvl*260) * (S.jacket ? 1 : 1.5);
    if (moveAcc >= step){
      moveAcc = 0;
      ["bonnie","chica","freddy","foxy"].forEach(k=>{
        const p = PATHS[k], at = G.pos[k];
        if (at >= p.length-1) return;
        if (k==="freddy" && G.camUp) return;              // Freddy kamera açıkken donuyor
        if (k==="foxy" && G.camUp && selected==="Pirate Cove") return;
        if (Math.random() < (lvl + (S.jacket?2:0)) / 22) {
          G.pos[k] = at+1; A.step();
        }
      });
    }

    // kapıda bekleyenler
    const lAt = (PATHS.bonnie[G.pos.bonnie]==="LEFT");
    const rKind = PATHS.chica[G.pos.chica]==="RIGHT" ? "chica"
                : (PATHS.freddy[G.pos.freddy]==="RIGHT" ? "freddy" : null);
    const rAt = !!rKind;
    if (lAt !== G.wasL){ figL.innerHTML = lAt ? figure("bonnie",250) : ""; G.wasL = lAt; }
    if (rKind !== G.wasR){ figR.innerHTML = rKind ? figure(rKind,250) : ""; G.wasR = rKind; }
    const opL = (lAt && G.lightL) ? ".98" : (lAt ? ".16" : "0");
    const opR = (rAt && G.lightR) ? ".98" : (rAt ? ".16" : "0");
    if (opL !== G.lastOpL){ figL.style.opacity = opL; G.lastOpL = opL; }
    if (opR !== G.lastOpR){ figR.style.opacity = opR; G.lastOpR = opR; }
    lampL.classList.toggle("on", lAt && !G.doorL);
    lampR.classList.toggle("on", rAt && !G.doorR);

    const delay = G.cold > 90 ? 3000 : 2200;   // üşüyorsan tepkin geç
    G.atDoor.L = lAt ? (G.doorL ? 0 : G.atDoor.L + dt) : 0;
    G.atDoor.R = rAt ? (G.doorR ? 0 : G.atDoor.R + dt) : 0;
    if (lAt && G.doorL && G.atDoor.L===0 && Math.random()<0.004) G.pos.bonnie = 1;
    if (rAt && G.doorR && G.atDoor.R===0 && Math.random()<0.004){ G.pos.chica=1; G.pos.freddy=1; }
    if (G.atDoor.L > delay){ die("bonnie","Batı kapı açıktı."); return false; }
    if (G.atDoor.R > delay){ die("chica","Doğu kapı açıktı."); return false; }

    // Foxy koşusu
    if (PATHS.foxy[G.pos.foxy]==="RUN"){
      G.pos.foxy = 0;
      if (G.doorL){ G.power -= 6; A.doorMove();
        subs.say("gil","(Foxy kapıya vurdu. Güç gitti.)",{night,hold:1300}); }
      else { die("foxy","Foxy koridoru koştu."); return false; }
    }

    drawCams(); updateHud();
  });

  // HUD de her karede yazılıyordu. Değişmeyen alana dokunmuyoruz artık.
  const hudEl = { clock:$("hClock"), pow:$("hPow"), use:$("hUse"), mPow:$("mPow"),
                  mCold:$("mCold"), boxHud:$("boxHud"), mBox:$("mBox") };
  const hudLast = {};
  function updateHud(){
    const clock = (G.hour===0?12:G.hour) + " AM";
    if (hudLast.clock !== clock){ hudEl.clock.textContent = clock; hudLast.clock = clock; }

    const p = Math.max(0, G.power), pr = p.toFixed(0);
    if (hudLast.pow !== pr){
      hudEl.pow.textContent = pr + "%";
      hudEl.mPow.style.width = p + "%";
      hudEl.mPow.parentElement.classList.toggle("warn", p < 25);
      hudLast.pow = pr;
    }
    if (hudLast.use !== G.use){
      hudEl.use.textContent = "▮".repeat(G.use);
      hudEl.use.dataset.lvl = G.use;
      hudLast.use = G.use;
    }
    const c = G.cold.toFixed(0);
    if (hudLast.cold !== c){ hudEl.mCold.style.width = c + "%"; hudLast.cold = c; }

    if (hudEl.boxHud.hidden !== !G.boxOn) hudEl.boxHud.hidden = !G.boxOn;
    if (G.boxOn){
      const b = G.box.toFixed(0);
      if (hudLast.box !== b){
        hudEl.mBox.style.width = b + "%";
        const b2 = $("mBox2"); if (b2) b2.style.width = b + "%";
        hudLast.box = b;
      }
    }
  }

  function powerOut(){
    if (G.over) return; G.over = true;
    A.fanOff(); cams.hidden = true;
    room.querySelectorAll(".shutter").forEach(x=>{ x.classList.remove("down"); x.classList.add("up"); });
    room.querySelectorAll(".warnlamp").forEach(x=>x.classList.remove("on"));
    room.classList.add("blackout");
    A.bad();
    later(()=>die("freddy","Güç bitti."), 3600);
  }

  function finishNight(){
    if (G.over) return; G.over = true;
    A.fanOff(); A.chime();
    later(()=>sceneNightEnd(), 1400);
  }
}

/* ==========================================================================
   8. GECE SONU — tanınma anı
   ========================================================================== */
const BEATS = {
  1:{who:null, text:"Kimse ona bakmadı. Sadece avlandılar.",
     note:"Korku kişisel değil — henüz."},
  2:{who:"bonnie", text:"Köşeye sıkıştı ve ağladı. Bonnie durdu.",
     note:"O adam hiç ağlamamıştı."},
  3:{who:"chica", text:"Karanlık mutfakta babasını anlattı. Chica dinledi.",
     note:"Mutfak artık güvenli."},
  4:{who:"foxy", text:"Foxy koştu ve durdu. Jesse kaçmadı, ceketi yere bıraktı.",
     note:"Freddy izledi. Karar vermedi. Henüz."},
  5:{who:null, text:"Dördü karar verdi.",
     note:"Karar vermeyen tek biri kaldı."}
};
function sceneNightEnd(){
  const b = BEATS[S.night];
  if (b.who) S.turned[b.who] = true;
  if (S.night === 4) S.turned.freddy = true;

  const s = screen();
  const c = el("div","card");
  c.appendChild(el("h2",null,`6 AM &nbsp;·&nbsp; Gece ${S.night} bitti`));
  c.appendChild(el("p",null,b.text));
  if (b.who){
    const d = el("div","beat");
    d.style.color = SPEAK[b.who].color;
    d.textContent = `${SPEAK[b.who].name.toLowerCase()} artık el yazısıyla konuşuyor`;
    c.appendChild(d);
    c.appendChild(el("p",null,`— ${SOULNAME[b.who]}`));
  }
  c.appendChild(el("p",null,b.note));

  const btn = el("button","mbtn primary");
  btn.style.marginTop = "22px";
  if (S.night < 5){ btn.textContent = `▶ Gece ${S.night+1}`; btn.onclick = ()=>{ S.night++; sceneOpener(); }; }
  else            { btn.textContent = "▶ Safe room";        btn.onclick = sceneSafeRoom; }
  c.appendChild(btn);
  s.appendChild(c);
  show(s);
}

/* ==========================================================================
   9. SAFE ROOM — oyunun tersine dönen mekaniği
      Oyun sana "KUR" diye bağırıyor. Kazanmanın tek yolu kurmamak.
   ========================================================================== */
function sceneSafeRoom(){
  const s = screen();
  const room = roomBox("void");
  room.style.cursor = "default";
  // çıplak beton oda — yedek kostümler duvarda asılı
  const back = el("div","bg");
  back.innerHTML = `<svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      ${DEFS}
      <rect width="1600" height="1000" fill="#0a0c11"/>
      <rect x="0" y="0" width="1600" height="660" fill="#12161d"/>
      <rect x="0" y="0" width="1600" height="660" fill="url(#wallGrad)"/>
      ${Array.from({length:9},(_,i)=>
        `<rect x="${i*180}" y="0" width="2" height="660" fill="#0d1116"/>`).join("")}
      ${Array.from({length:4},(_,i)=>
        `<rect x="0" y="${140+i*140}" width="1600" height="2" fill="#0d1116"/>`).join("")}
      <rect x="0" y="652" width="1600" height="12" fill="#1a2029"/>
      <g opacity=".28">
        <rect x="1180" y="180" width="14" height="60" fill="#2a3140"/>
        <g transform="translate(1120,240) scale(.9)">${FIGURES.golden()}</g>
        <rect x="1420" y="180" width="14" height="60" fill="#2a3140"/>
        <g transform="translate(1360,250) scale(.8)">${FIGURES.golden()}</g>
      </g>
      <g opacity=".5">
        <rect x="150" y="470" width="180" height="120" rx="4" fill="#2a2318"/>
        <rect x="150" y="470" width="180" height="10" fill="#3a3020"/>
        <rect x="200" y="500" width="80" height="6" fill="#4a3f28"/>
      </g>
      <ellipse cx="700" cy="740" rx="520" ry="220" fill="url(#warmPool)"/>
      <path d="M760 0 v300" stroke="#2a3140" stroke-width="3"/>
      <g class="lampglow">
        <ellipse cx="760" cy="304" rx="30" ry="8" fill="#ffeec2"/>
        <path d="M730 304 L620 700 L900 700 L790 304 Z" fill="url(#lampCone)"/>
      </g>
    </svg>`;
  room.insertBefore(back, room.firstChild);

  const head = el("div");
  head.style.cssText="position:absolute;top:10px;left:14px;z-index:5;font-size:10.5px;"+
    "letter-spacing:.16em;text-transform:uppercase;color:#5c6472";
  head.innerHTML = "Gece 5 &nbsp;·&nbsp; 5:12 AM<br><span style='color:#3d4450'>Batı duvarının arkası — planda olmayan oda</span>";
  room.appendChild(head);

  const gf = el("div","figure", figure("golden",180));
  gf.style.cssText = "left:20%;bottom:30%;opacity:.55";
  room.appendChild(gf);

  const jf = el("div","figure", figure("jesse",140));
  jf.style.cssText = "left:58%;bottom:30%;opacity:.9";
  room.appendChild(jf);

  const pp = el("div","figure", figure("puppet",230));
  pp.style.cssText = "left:88%;bottom:30%;opacity:0;transition:opacity 2.4s ease, left 3s ease";
  room.appendChild(pp);

  // panel
  const panel = el("div");
  panel.style.cssText="position:absolute;right:14px;top:14px;z-index:6;width:230px;"+
    "background:rgba(4,5,7,.86);border:1px solid #2a2f38;padding:12px";
  panel.innerHTML = `
    <div style="font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#5c6472">
      Müzik kutusu</div>
    <div class="meter gold" style="width:100%;margin:8px 0"><i id="sBox" style="width:100%"></i></div>
    <button class="cbtn" id="sWind" style="width:100%;border-color:#8a6a2a;color:#e8c33a">
      Basılı tut — KUR</button>
    <button class="cbtn" id="sCoat" style="width:100%;margin-top:6px">Ceketi çıkar</button>
    <div id="sWarn" style="margin-top:10px;font-family:var(--f-machine);font-size:14px;
      letter-spacing:.16em;color:var(--c-bad);min-height:20px;text-align:center"></div>`;
  panel.hidden = true;
  room.appendChild(panel);

  s.appendChild(room);
  const hint = el("div","hint","");
  s.appendChild(hint);
  show(s); A.init();

  const subs = makeSubs(room);
  const $ = id => room.querySelector("#"+id);

  (async ()=>{
    await wait(1000);
    await subs.say("golden","YOU'RE NOT HIM.", {night:5, pos:"left", hold:1400});
    await subs.beat(400);
    await subs.say("golden","DON'T COME BACK. NEXT TIME I WON'T CHECK.", {night:5, pos:"left", hold:1800});
    await subs.beat(500);
    await subs.say("gil","(Cassidy'nin yazısı hiç dönmedi. Ekrandaki tek makine yazısı onunki.)",
                   {night:5, hold:1800});
    await subs.beat(300);

    panel.hidden = false;
    hint.textContent = "Müzik kutusu boşalmak üzere.";
    A.boxNote(0,1);
    runBox();
  })();

  function runBox(){
    let box = 100, coat = true, still = 0, winding = false, done = false;
    const bar = $("sBox"), warn = $("sWarn"), wind = $("sWind"), coatBtn = $("sCoat");

    wind.addEventListener("pointerdown", ()=>winding=true);
    const up = ()=>winding=false;
    window.addEventListener("pointerup", up);
    rafs.push(()=>window.removeEventListener("pointerup", up));

    coatBtn.onclick = ()=>{
      if (!coat) return;
      coat = false; A.step();
      coatBtn.textContent = "Ceket yerde";
      coatBtn.style.opacity = ".5";
      jf.innerHTML = figure("jesse",140,false);      // ceketsiz: gözle görülür şekilde küçük
      const coatOnFloor = el("div","figure");
      coatOnFloor.style.cssText = "left:52%;bottom:29%;z-index:2;filter:brightness(.5)";
      coatOnFloor.innerHTML = `<svg viewBox="0 0 200 80" height="34" aria-hidden="true">
        <ellipse cx="100" cy="58" rx="62" ry="15" fill="#2b313b"/>
        <ellipse cx="100" cy="50" rx="52" ry="12" fill="#343c48"/>
        <rect x="72" y="34" width="56" height="16" rx="7" fill="#2b313b"/></svg>`;
      room.appendChild(coatOnFloor);
      subs.say("gil","(Ceket katlanıp yere kondu.)",{night:5,hold:1600});
    };

    let last = performance.now(), acc = 0;
    loop(t=>{
      if (done) return false;
      const dt = Math.min(70, t-last); last = t;

      if (winding){ box = Math.min(100, box + dt/1000*30); still = 0; }
      else { box -= dt/1000*7; still += dt; }
      box = Math.max(0, box);
      bar.style.width = box + "%";

      acc += dt;
      if (acc > 640 - box*3.2){ acc = 0; A.boxNote((t/640)|0, box/100); }

      // oyun seni kurmaya zorluyor
      if (box < 55 && box > 0){
        warn.textContent = box < 22 ? "SHE IS COMING" : "WIND IT";
        if (!reduced) warn.style.opacity = (Math.sin(t/120)*.5+.5).toFixed(2);
      } else warn.textContent = "";

      if (winding){
        hint.textContent = "Kurdukça hiçbir şey olmuyor. Kutu bitmeden bu oda bitmiyor.";
      }

      if (box <= 0){
        done = true;
        if (coat){
          hint.textContent = "";
          subs.clear();
          subs.say("gil","(Ceket hâlâ üstünde. Seni yine o adam sandı.)",{night:5,hold:2200});
          later(()=>{ A.scare(); const sc=el("div"); sc.id="scare";
            sc.innerHTML=`<div style="text-align:center"><div>${figure("puppet",240)}</div>
              <div class="msg" style="margin-top:12px">Ceketi çıkarmadın.</div></div>`;
            room.appendChild(sc); later(sceneSafeRoom, 2600); }, 2400);
        } else {
          finale();
        }
        return false;
      }
    });

    async function finale(){
      panel.hidden = true;
      hint.textContent = "";
      A.fanOff();
      pp.style.opacity = ".95"; pp.style.left = "68%";
      await wait(2600);
      await subs.say("gil","(Puppet onu kaldırıyor.)",{night:5,hold:2000});
      await subs.beat(600);
      await subs.say("gil","(Ve yere bırakıyor.)",{night:5,hold:2200});
      await subs.beat(500);
      await subs.say("gil","(Maske vermiyor. Babasının kutusunu veriyor. Ve kapıyı gösteriyor.)",
                     {night:5,hold:3000});
      await subs.beat(700);
      A.chime();
      await wait(1600);
      sceneAfterFive();
    }
  }
}

/* ==========================================================================
   10. 2023 — gazete, telefon, "Okay."
   ========================================================================== */
function sceneNewspaper(){
  const s = screen();
  const p = el("div","paper");
  p.innerHTML = `
    <div class="kicker"><span>Local</span><span>August 2023</span></div>
    <h3>Fazbear's Fright: Thirty Years Later, The Horror Returns</h3>
    <div class="rule"></div>
    <p class="lede">Operators of a new horror attraction say the exhibit will
    display <em>genuine artifacts recovered from the original locations</em> —
    including, they claim, one intact animatronic. The attraction opens on the
    site of the restaurant that closed at the end of 1993.</p>`;
  s.appendChild(p);
  const b = el("button","mbtn primary","Telefonu çıkar");
  b.style.marginTop="22px"; b.onclick = scenePhone;
  s.appendChild(b);
  s.appendChild(el("div","hint","Masanın kenarında katlanmış eski bir servis ceketi duruyor. Hiç atmamış."));
  show(s); A.init();
}

function scenePhone(){
  const s = screen();
  const wrap = el("div");
  wrap.style.cssText="position:relative;width:min(900px,96vw);min-height:60vh;display:flex;"+
    "flex-direction:column;align-items:center;justify-content:center;gap:18px";
  const ph = el("div","phone");
  ph.innerHTML = `<div class="name">Mike</div><div class="st" id="pst">calling…</div>`;
  wrap.appendChild(ph);
  s.appendChild(wrap);
  s.appendChild(el("div","hint","Rehberde soyad yok. Otuz yıldır yok."));
  show(s); A.init();

  const subs = makeSubs(wrap);
  subs.el.style.position = "relative";
  subs.el.style.bottom = "auto";
  subs.el.style.marginTop = "12px";

  const st = wrap.querySelector("#pst");

  (async ()=>{
    for (let i=0;i<6;i++){ A.ping(); await wait(750); }
    st.textContent = "connected";
    await wait(1400);
    st.textContent = "— silence —";
    await wait(1600);

    // Jesse'nin yazı tipi artık soğuk. Kimse söylemiyor.
    await subs.say("jesseOld","It's open again. Same building.", {hold:1800});
    await subs.beat(1800);
    await subs.say("jesseOld","They're advertising real ones. If it's them, they've been in a crate since '93.", {hold:2200});
    await subs.beat(2400);
    await subs.say("jesseOld","I'm not going.", {hold:2400});
    await subs.beat(2000);

    subs.clear();
    const line = el("div","center-line","Okay.");
    line.style.opacity = "0";
    line.style.transition = "opacity 1.1s ease";
    wrap.appendChild(line);
    await wait(60); line.style.opacity = "1";
    await wait(2600);

    st.textContent = "call ended";
    A.bad();
    await wait(2200);
    sceneCredits();
  })();
}

/* ==========================================================================
   11. JENERİK — beş isim, sadece beş açılışı da dinlediysen
   ========================================================================== */
function sceneCredits(){
  S.finished = true;
  const s = screen();
  const c = el("div","card");
  c.appendChild(el("h2",null,"August 2023"));

  const all = S.openersHeard.every(Boolean);
  if (all){
    const names = el("div");
    names.style.cssText="margin:26px 0;display:flex;flex-direction:column;gap:9px";
    [["freddy","Gabriel"],["bonnie","Jeremy"],["chica","Susie"],
     ["foxy","Fritz"],["golden","Cassidy"]].forEach(([k,n])=>{
      const d = el("div", null, n);
      d.style.cssText = `font-family:${k==="golden"?"var(--f-machine)":"var(--f-child)"};
        font-size:${k==="golden"?"22px":"28px"};color:${SPEAK[k].color};
        ${k==="golden"?"letter-spacing:.2em;text-transform:uppercase;":"text-transform:lowercase;"}`;
      names.appendChild(d);
    });
    c.appendChild(names);
    c.appendChild(el("p",null,"Beş açılışı da dinledin. İsimler bu yüzden burada."));
  } else {
    c.appendChild(el("p",null,"Jenerik boş geçiyor."));
    c.appendChild(el("p",null,
      "Beş gece açılışını da sonuna kadar dinleseydin burada beş isim olurdu."));
  }

  c.appendChild(el("div","beat","five nights at freddy's 3 buradan başlıyor"));
  const b = el("button","mbtn primary","← Menü"); b.style.marginTop="20px";
  b.onclick = sceneMenu; c.appendChild(b);
  s.appendChild(c);
  show(s);
}
